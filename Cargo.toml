[package]
name = "ods2tsv"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dump every sheet from an ODS document into a timestamped directory as TSV files"

[profile.release]
strip = true
lto = true

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

unexpected_cfgs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# change to warn pre-release
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
cfg_not_test = "warn"
expect_used = "warn"
indexing_slicing = "warn"
module_name_repetitions = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
jiff = "0.2.34"
quick-xml = { version = "0.41.0", features = ["encoding"] }
rayon = "1.12.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
