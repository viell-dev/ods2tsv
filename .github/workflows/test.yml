name: Rust Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pinned toolchain
      run: rustup show active-toolchain

    - name: Check formatting
      run: cargo fmt --check

    - name: Lint
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      run: cargo test
